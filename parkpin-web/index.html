
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FDF9F2">
    <title>ParkPin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        background-color: #FDF9F2;
        color: #374151;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      .bg-parkpin-primary { background-color: #1D56CF; }
      .text-parkpin-primary { color: #1D56CF; }
      
      .parkpin-logo-mark {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #1D56CF 0%, #4A7FFF 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(29, 86, 207, 0.25);
        position: relative;
        overflow: hidden;
      }
      .parkpin-logo-mark::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        background: white;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        margin-top: -2px;
      }
      .parkpin-logo-mark::before {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        background: #1D56CF;
        border-radius: 50%;
        z-index: 2;
        margin-top: -3px;
      }
      .map-container {
        position: relative;
        overflow: hidden;
        border-radius: 2rem;
        aspect-ratio: 16 / 11;
        background: #e5e7eb;
        z-index: 1;
      }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in-up {
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .leaflet-container {
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* Custom Pin Marker Style */
      .custom-pin-icon {
        background: none !important;
        border: none !important;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@capacitor-community/admob": "https://esm.sh/@capacitor-community/admob@^8.0.0"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
